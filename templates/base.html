{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ s.meta_title }}</title>
<meta name="description" content="{{ s.meta_description }}">
<meta property="og:title" content="{{ s.meta_title }}">
<meta property="og:description" content="{{ s.meta_description }}">
<link rel="canonical" href="{{ request.build_absolute_uri }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top nav-dark">
 <div class="container">
  <a class="navbar-brand fw-bold" href="/"><i class="bi bi-code-slash text-primary-blue"></i> {{ s.brand_name }}</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav">
   <ul class="navbar-nav mx-auto">
    <li class="nav-item"><a class="nav-link" href="/#home">Home</a></li>
    <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
    <li class="nav-item"><a class="nav-link" href="/#education">Education</a></li>
    <li class="nav-item"><a class="nav-link" href="/#skills">Skills</a></li>
    <li class="nav-item"><a class="nav-link" href="/#projects">Projects</a></li>
    {% if s.show_referees %}<li class="nav-item"><a class="nav-link" href="/#referees">Referees</a></li>{% endif %}
    <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
   </ul>
   <div class="d-flex gap-3 fs-5">
    <a href="{{ s.github_url }}" aria-label="GitHub" rel="noopener" target="_blank"><i class="bi bi-github"></i></a>
    <a href="{{ s.youtube_url }}" aria-label="YouTube" rel="noopener" target="_blank"><i class="bi bi-youtube"></i></a>
   </div>
  </div>
 </div>
</nav>
{% block content %}{% endblock %}
<footer class="py-4 border-top-soft">
 <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3 small text-muted2">
  <span>&copy; <span id="year"></span> {{ s.brand_name }}. All rights reserved.</span>
  <span class="fs-5 d-flex gap-3">
   <a href="{{ s.github_url }}" aria-label="GitHub"><i class="bi bi-github"></i></a>
   <a href="{{ s.youtube_url }}" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
   <a href="#home" aria-label="Back to top"><i class="bi bi-arrow-up-circle"></i></a>
  </span>
 </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
